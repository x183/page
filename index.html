<script type="text/javascript">
function populateEducationContainer() {
  const ec = document.getElementById("EducationContainer");
  education.forEach((edu)=>{
    ec.appendChild(createEducation(edu))
  })
}
function populateJobContainer() {
  const jc = document.getElementById("JobContainer");
  jobs.forEach((job)=> {
    jc.appendChild(createJob(job))
  })
}
function populateProjectContainer() {
  const pc = document.getElementById("ProjectContainer");
  projects.forEach((project)=> {
    pc.appendChild(createProject(project))
  })
}

window.onload = function () {
  populateEducationContainer();
  populateJobContainer();
  populateProjectContainer();
}
</script>
